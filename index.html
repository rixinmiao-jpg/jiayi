<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dbeafe">
<title>佳宜的小天地 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --blue-200: #bfdbfe;
    --blue-300: #93c5fd;
    --blue-400: #60a5fa;
    --blue-500: #3b82f6;
    --blue-600: #2563eb;
    --blue-700: #1d4ed8;
    --blue-800: #1e40af;
    --pink-100: #fce7f3;
    --pink-300: #f9a8d4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 18px;
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 35%, #fdf2f8 100%);
    min-height: 100vh;
    color: #1e293b;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
    line-height: 1.5;
  }

  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-circle { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4; }
  .bg-circle.c1 { width: 280px; height: 280px; background: #93c5fd; top: -80px; right: -60px; animation: float1 8s ease-in-out infinite; }
  .bg-circle.c2 { width: 220px; height: 220px; background: #f9a8d4; bottom: 20%; left: -50px; animation: float2 10s ease-in-out infinite; }
  .bg-circle.c3 { width: 180px; height: 180px; background: #c4b5fd; top: 40%; right: -30px; animation: float3 12s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,30px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-20px)} }
  @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-15px,25px)} }

  .page { position: relative; z-index: 1; display: none; }
  .page.active { display: block; animation: fadeSlide 0.4s ease; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== 登录 / 设置密码卡片 ===== */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 20px 60px rgba(59,130,246,0.15);
    border: 1px solid rgba(255,255,255,0.7);
    animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .login-icon {
    width: 72px; height: 72px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #60a5fa, #f9a8d4);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 24px rgba(96,165,250,0.35);
    animation: heartBeat 1.8s ease-in-out infinite;
  }
  @keyframes heartBeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .login-title {
    text-align: center; font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, var(--blue-600), var(--blue-800));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 6px;
  }
  .login-sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 28px; }

  .form-field { margin-bottom: 18px; }
  .form-field label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 8px; }
  .form-field input, .form-field textarea {
    width: 100%; padding: 13px 16px;
    border: 1.5px solid var(--blue-200); border-radius: 14px;
    font-size: 15px; background: rgba(255,255,255,0.9); color: #1e293b;
    outline: none; transition: all 0.2s;
    font-family: inherit;
  }
  .form-field input:focus, .form-field textarea:focus { border-color: var(--blue-400); box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 8px 20px rgba(59,130,246,0.35);
    transition: all 0.2s; cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-ghost {
    width: 100%; padding: 12px; margin-top: 12px;
    background: transparent; color: #64748b;
    border: 1.5px solid #e2e8f0; border-radius: 14px;
    font-size: 14px; cursor: pointer;
  }
  .form-tip { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 14px; }

  /* ===== 加载页 ===== */
  .loading-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--blue-200); border-top-color: var(--blue-500);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #64748b; }

  /* ===== 主页 ===== */
  .header {
    position: sticky; top: 0; z-index: 20;
    padding: calc(14px + var(--safe-top)) 20px 12px;
    background: rgba(239,246,255,0.8);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 21px; font-weight: 800;
    background: linear-gradient(135deg, var(--blue-600), #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header-sub { font-size: 11px; color: #94a3b8; margin-top: 1px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px;
    background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer; box-shadow: 0 2px 8px rgba(59,130,246,0.08);
  }
  .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 4px; vertical-align: 1px; }
  .sync-dot.busy { background: #f59e0b; animation: blink 0.8s ease-in-out infinite; }
  .sync-dot.err { background: #ef4444; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .chips-wrap { padding: 6px 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .chips-wrap::-webkit-scrollbar { display: none; }
  .chips { display: flex; gap: 9px; padding: 4px 2px; width: max-content; }
  .chip {
    flex-shrink: 0;
    padding: 9px 16px;
    background: rgba(255,255,255,0.8);
    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 999px;
    font-size: 14px; color: #475569; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(59,130,246,0.06);
    transition: all 0.2s;
  }
  .chip.active {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 16px rgba(59,130,246,0.35);
  }
  .chip .cnt { font-size: 11px; opacity: 0.75; margin-left: 3px; }
  .chip-add { border-style: dashed; border-color: var(--blue-300); color: var(--blue-500); background: rgba(219,234,254,0.5); }

  .content { padding: 6px 16px 110px; }

  .note-card {
    background: rgba(255,255,255,0.88);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(59,130,246,0.08);
    border: 1px solid rgba(255,255,255,0.9);
    animation: fadeSlide 0.35s ease;
    position: relative;
  }
  .note-imgs { display: grid; gap: 6px; margin-bottom: 10px; }
  .note-imgs.n1 { grid-template-columns: 1fr; }
  .note-imgs.n2 { grid-template-columns: 1fr 1fr; }
  .note-imgs.n3 { grid-template-columns: 1fr 1fr 1fr; }
  .note-imgs img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 12px; background: var(--blue-100);
    display: block;
  }
  .img-pending {
    width: 100%; aspect-ratio: 1; border-radius: 12px;
    background: var(--blue-100); color: #64748b;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center; padding: 8px;
  }
  .note-text { font-size: 14.5px; color: #334155; white-space: pre-wrap; word-break: break-word; }
  .note-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .note-date { font-size: 11px; color: #94a3b8; }
  .note-del { font-size: 12px; color: #cbd5e1; background: none; border: none; padding: 4px 8px; cursor: pointer; }
  .note-del:active { color: #ef4444; }

  .empty-state { text-align: center; padding: 70px 20px; color: #94a3b8; }
  .empty-state .big { font-size: 52px; margin-bottom: 14px; animation: heartBeat 2s ease-in-out infinite; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  .fab {
    position: fixed; right: 20px; bottom: calc(26px + var(--safe-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-500), #a855f7);
    color: #fff; font-size: 28px; border: none;
    box-shadow: 0 10px 26px rgba(59,130,246,0.45);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 30;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.9); }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,23,42,0.45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .mask.show { display: flex; animation: maskIn 0.25s ease; }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: 100%; max-width: 480px;
    background: #fff;
    border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(24px + var(--safe-bottom));
    animation: sheetUp 0.3s cubic-bezier(0.16,1,0.3,1);
    max-height: 88vh; overflow-y: auto;
  }
  @keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-title { font-size: 17px; font-weight: 700; color: #1e293b; margin-bottom: 16px; text-align: center; }

  .photo-btns { display: flex; gap: 10px; margin-bottom: 14px; }
  .photo-btn {
    flex: 1; padding: 13px 8px;
    border-radius: 14px; border: 1.5px dashed var(--blue-300);
    background: var(--blue-50); color: var(--blue-600);
    font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: center;
  }
  .photo-btn:active { background: var(--blue-100); }

  .pending-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pending-imgs .pi { position: relative; width: 74px; height: 74px; }
  .pending-imgs img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .pending-imgs .rm {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #ef4444; color: #fff; border: none;
    font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .emoji-opt {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--blue-50); border: 1.5px solid transparent;
    font-size: 21px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .emoji-opt.sel { border-color: var(--blue-500); background: var(--blue-100); }

  .stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid #f1f5f9;
    font-size: 14px; color: #475569;
  }
  .stat-row b { color: var(--blue-600); }
  .stat-cards { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: linear-gradient(135deg, var(--blue-50), var(--pink-100));
    border-radius: 16px; padding: 16px 10px; text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--blue-600); }
  .stat-card .lab { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,41,59,0.92); color: #fff;
    padding: 11px 22px; border-radius: 999px;
    font-size: 13.5px; z-index: 99;
    opacity: 0; pointer-events: none;
    transition: all 0.3s;
    max-width: 82vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .upload-bar {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
  }
  .upload-bar.show { display: flex; }
  .upload-box {
    background: #fff; border-radius: 22px; padding: 30px 40px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .upload-box .spinner { margin: 0 auto 14px; }
  .upload-box p { font-size: 14px; color: #475569; }
</style>
</head>
<body>

<div class="bg-deco">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>
</div>

<!-- 加载页 -->
<div class="page active" id="page-loading">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-text">正在打开佳宜的小天地…</div>
  </div>
</div>

<!-- 设置密码页 -->
<div class="page" id="page-setup">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon">💙</div>
      <div class="login-title">佳宜的小天地</div>
      <div class="login-sub">第一次来，先设一个只有你知道的密码吧</div>
      <div class="form-field">
        <label>设置密码</label>
        <input type="password" id="setup-pw" placeholder="至少 4 位" maxlength="30">
      </div>
      <div class="form-field">
        <label>再输一遍</label>
        <input type="password" id="setup-pw2" placeholder="确认密码" maxlength="30">
      </div>
      <button class="btn-primary" id="btn-setup">设好啦，进去 →</button>
      <div class="form-tip">密码会保存在云端，换手机也能用 ✨</div>
    </div>
  </div>
</div>

<!-- 登录页 -->
<div class="page" id="page-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon">💙</div>
      <div class="login-title">佳宜的小天地</div>
      <div class="login-sub">欢迎回来，输入密码开门吧～</div>
      <div class="form-field">
        <label>密码</label>
        <input type="password" id="login-pw" placeholder="输入密码" maxlength="30">
      </div>
      <button class="btn-primary" id="btn-login">开门 →</button>
      <div class="form-tip">这是属于庞佳宜的小秘密 🤫</div>
    </div>
  </div>
</div>

<!-- 主页 -->
<div class="page" id="page-main">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">佳宜的小天地 💙</div>
        <div class="header-sub"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">云端已同步</span></div>
      </div>
      <div class="header-actions">
        <div class="icon-btn" id="btn-stats">📊</div>
        <div class="icon-btn" id="btn-settings">⚙️</div>
      </div>
    </div>
    <div class="chips-wrap">
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <div class="content" id="notes-list"></div>
  <button class="fab" id="btn-add">＋</button>
</div>

<!-- 记一笔弹窗 -->
<div class="mask" id="mask-note">
  <div class="sheet">
    <div class="sheet-title">记一笔 <span id="note-hobby-name"></span></div>
    <div class="photo-btns">
      <button class="photo-btn" id="btn-camera">📷 拍照</button>
      <button class="photo-btn" id="btn-album">🖼️ 从相册选</button>
    </div>
    <input type="file" id="file-camera" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="file-album" accept="image/*" multiple style="display:none">
    <div class="pending-imgs" id="pending-imgs"></div>
    <div class="form-field">
      <textarea id="note-text" rows="3" placeholder="写点什么吧…（可以不写）"></textarea>
    </div>
    <button class="btn-primary" id="btn-save-note">保存到云端 ☁️</button>
    <button class="btn-ghost" id="btn-cancel-note">取消</button>
  </div>
</div>

<!-- 新爱好弹窗 -->
<div class="mask" id="mask-hobby">
  <div class="sheet">
    <div class="sheet-title">新建一个爱好分类</div>
    <div class="emoji-row" id="emoji-row"></div>
    <div class="form-field">
      <input type="text" id="hobby-name" placeholder="比如：听歌、追星、画画…" maxlength="10">
    </div>
    <button class="btn-primary" id="btn-save-hobby">创建 ✨</button>
    <button class="btn-ghost" id="btn-cancel-hobby">取消</button>
  </div>
</div>

<!-- 统计弹窗 -->
<div class="mask" id="mask-stats">
  <div class="sheet">
    <div class="sheet-title">📊 小统计</div>
    <div class="stat-cards">
      <div class="stat-card"><div class="num" id="st-notes">0</div><div class="lab">条记录</div></div>
      <div class="stat-card"><div class="num" id="st-imgs">0</div><div class="lab">张照片</div></div>
      <div class="stat-card"><div class="num" id="st-hobbies">0</div><div class="lab">个爱好</div></div>
    </div>
    <div id="stat-rows"></div>
    <button class="btn-ghost" id="btn-close-stats">关闭</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="mask-settings">
  <div class="sheet">
    <div class="sheet-title">⚙️ 设置</div>
    <div class="form-field">
      <label>修改密码（先输旧密码）</label>
      <input type="password" id="pw-old" placeholder="旧密码" maxlength="30">
    </div>
    <div class="form-field">
      <input type="password" id="pw-new" placeholder="新密码（至少 4 位）" maxlength="30">
    </div>
    <button class="btn-primary" id="btn-chpw">修改密码</button>
    <button class="btn-ghost" id="btn-logout">退出登录</button>
    <button class="btn-ghost" id="btn-close-settings">关闭</button>
    <div class="form-tip">所有数据都存在云端，换手机登录密码就能看到 💙</div>
  </div>
</div>

<!-- 上传进度 -->
<div class="upload-bar" id="upload-bar">
  <div class="upload-box">
    <div class="spinner"></div>
    <p id="upload-text">正在上传到云端…</p>
  </div>
</div>

<div id="toast"></div>

<script>

    { id: 'h5', name: '美好的风景', icon: '🏞️' }
  ];
  var EMOJIS = ['🎮','💙','🐱','🍜','🏞️','🎵','📚','🎬','🧸','🌸','⭐','🍰','🏀','✈️','🎨','🛹','📷','🌙'];

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function showPage(id) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    $(id).classList.add('active');
  }

  function setSync(state, text) {
    var d = $('sync-dot');
    d.className = 'sync-dot' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
    $('sync-text').textContent = text;
  }

  /* ---------- GitHub API ---------- */
  function gh(path, method, body) {
    var opts = {
      method: method || 'GET',
      headers: {
        'Authorization': 'token ' + CFG.token,
        'Accept': 'application/vnd.github+json',
        'User-Agent': 'jiayi-site'
      }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(API + path, opts).then(function(r) {
      if (r.status === 404) return null;
      if (r.status === 401) throw new Error('访问凭证失效，请联系网站管理员');
      if (!r.ok) throw new Error('网络请求失败(' + r.status + ')');
      return r.json();
    });
  }

  function b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64d(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g, '')))); }

  function loadData() {
    return gh('/contents/data.json').then(function(res) {
      if (!res) return null;
      dataSha = res.sha;
      return JSON.parse(b64d(res.content));
    });
  }

  function saveData() {
    setSync('busy', '正在保存到云端…');
    var clean = JSON.stringify(DB, function(k, v) { return k === '_preview' ? undefined : v; });
    var body = {
      message: '佳宜更新于 ' + new Date().toLocaleString('zh-CN'),
      content: b64e(clean),
      branch: CFG.branch
    };
    if (dataSha) body.sha = dataSha;
    return gh('/contents/data.json', 'PUT', body).then(function(res) {
      dataSha = res.content.sha;
      setSync('ok', '云端已同步 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
    }).catch(function(e) {
      setSync('err', '保存失败，请重试');
      throw e;
    });
  }

  function uploadImage(dataUrl, onProgress) {
    var name = 'images/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg';
    return gh('/contents/' + name, 'PUT', {
      message: '佳宜上传了一张照片',
      content: dataUrl.split(',')[1],
      branch: CFG.branch
    }).then(function() { return name; });
  }

  /* ---------- 密码 ---------- */
  function hashPw(pw) {
    var s = 'jiayi::' + pw;
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf) {
      var arr = new Uint8Array(buf), hex = '';
      for (var i = 0; i < arr.length; i++) hex += ('0' + arr[i].toString(16)).slice(-2);
      return hex;
    });
  }

  /* ---------- 图片压缩 ---------- */
  function compressImage(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var max = 1280, w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- 渲染 ---------- */
  function renderChips() {
    var box = $('chips');
    box.innerHTML = '';
    DB.hobbies.forEach(function(h) {
      var cnt = DB.notes.filter(function(n) { return n.hobbyId === h.id; }).length;
      var el = document.createElement('div');
      el.className = 'chip' + (curHobby === h.id ? ' active' : '');
      el.innerHTML = h.icon + ' ' + h.name + '<span class="cnt">' + cnt + '</span>';
      el.onclick = function() { curHobby = h.id; renderChips(); renderNotes(); };
      box.appendChild(el);
    });
    var add = document.createElement('div');
    add.className = 'chip chip-add';
    add.textContent = '＋ 新爱好';
    add.onclick = openHobbyModal;
    box.appendChild(add);
  }

  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  window.imgFail = function(el) {
    var p = el.getAttribute('data-path');
    if (!p) return;
    if (el.src.indexOf('raw.githubusercontent') === -1) {
      el.src = CFG.raw + p;
    } else {
      var div = document.createElement('div');
      div.className = 'img-pending';
      div.textContent = '☁️ 图片同步中，稍后刷新';
      el.parentNode.replaceChild(div, el);
    }
  };

  function renderNotes() {
    var box = $('notes-list');
    box.innerHTML = '';
    var list = DB.notes.filter(function(n) { return n.hobbyId === curHobby; })
      .sort(function(a, b) { return b.ts - a.ts; });

    if (!list.length) {
      var h = DB.hobbies.filter(function(x) { return x.id === curHobby; })[0];
      box.innerHTML = '<div class="empty-state"><div class="big">' + (h ? h.icon : '💙') + '</div>' +
        '<p>这里还空空的～<br>点右下角 ＋ 记录第一张' + (h ? h.name : '') + '吧</p></div>';
      return;
    }

    list.forEach(function(n) {
      var card = document.createElement('div');
      card.className = 'note-card';

      if (n.images && n.images.length) {
        var grid = document.createElement('div');
        var cls = n.images.length === 1 ? 'n1' : n.images.length === 2 ? 'n2' : 'n3';
        grid.className = 'note-imgs ' + cls;
        n.images.forEach(function(p) {
          var img = document.createElement('img');
          img.setAttribute('data-path', p);
          img.loading = 'lazy';
          img.onerror = function() { window.imgFail(this); };
          if (n._preview && n._preview[p]) img.src = n._preview[p];
          else img.src = CFG.pages + p;
          grid.appendChild(img);
        });
        card.appendChild(grid);
      }

      if (n.text) {
        var t = document.createElement('div');
        t.className = 'note-text';
        t.textContent = n.text;
        card.appendChild(t);
      }

      var foot = document.createElement('div');
      foot.className = 'note-foot';
      foot.innerHTML = '<span class="note-date">' + fmtDate(n.ts) + '</span>';
      var del = document.createElement('button');
      del.className = 'note-del';
      del.textContent = '删除';
      del.onclick = function() { delNote(n.id); };
      foot.appendChild(del);
      card.appendChild(foot);

      box.appendChild(card);
    });
  }

  function renderAll() {
    if (!curHobby && DB.hobbies.length) curHobby = DB.hobbies[0].id;
    renderChips();
    renderNotes();
  }

  /* ---------- 操作 ---------- */
  function delNote(id) {
    if (!confirm('确定删掉这条记录吗？')) return;
    DB.notes = DB.notes.filter(function(n) { return n.id !== id; });
    renderAll();
    saveData().then(function() { toast('已删除 🗑️'); }).catch(function(e) { toast(e.message); });
  }

  function openHobbyModal() {
    var row = $('emoji-row');
    row.innerHTML = '';
    selEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    EMOJIS.forEach(function(e) {
      var b = document.createElement('button');
      b.className = 'emoji-opt' + (e === selEmoji ? ' sel' : '');
      b.textContent = e;
      b.onclick = function() {
        selEmoji = e;
        var opts = row.querySelectorAll('.emoji-opt');
        for (var i = 0; i < opts.length; i++) opts[i].classList.remove('sel');
        b.classList.add('sel');
      };
      row.appendChild(b);
    });
    $('hobby-name').value = '';
    $('mask-hobby').classList.add('show');
  }

  function renderPending() {
    var box = $('pending-imgs');
    box.innerHTML = '';
    pendingImgs.forEach(function(d, i) {
      var pi = document.createElement('div');
      pi.className = 'pi';
      var img = document.createElement('img');
      img.src = d;
      var rm = document.createElement('button');
      rm.className = 'rm';
      rm.textContent = '✕';
      rm.onclick = function() { pendingImgs.splice(i, 1); renderPending(); };
      pi.appendChild(img);
      pi.appendChild(rm);
      box.appendChild(pi);
    });
  }

  function handleFiles(files) {
    if (!files || !files.length) return;
    var arr = Array.prototype.slice.call(files).slice(0, 9 - pendingImgs.length);
    toast('正在压缩图片…');
    Promise.all(arr.map(compressImage)).then(function(urls) {
      pendingImgs = pendingImgs.concat(urls);
      renderPending();
    }).catch(function() { toast('图片读取失败，换一张试试'); });
  }

  function saveNote() {
    var text = $('note-text').value.trim();
    if (!text && !pendingImgs.length) { toast('先写点什么或者选张照片吧～'); return; }

    $('upload-bar').classList.add('show');
    var imgs = pendingImgs.slice();
    var previews = {};
    var paths = [];
    var step = 0;

    function next() {
      if (step < imgs.length) {
        $('upload-text').textContent = '正在上传照片 ' + (step + 1) + '/' + imgs.length + '…';
        uploadImage(imgs[step]).then(function(name) {
          paths.push(name);
          previews[name] = imgs[step];
          step++;
          next();
        }).catch(fail);
      } else {
        $('upload-text').textContent = '正在保存…';
        var note = {
          id: 'n' + Date.now() + Math.random().toString(36).slice(2, 5),
          hobbyId: curHobby,
          text: text,
          images: paths,
          ts: Date.now(),
          _preview: previews
        };
        DB.notes.push(note);
        saveData().then(function() {
          $('upload-bar').classList.remove('show');
          $('mask-note').classList.remove('show');
          pendingImgs = [];
          $('note-text').value = '';
          renderPending();
          renderAll();
          toast('保存成功 ☁️');
        }).catch(fail);
      }
    }
    function fail(e) {
      $('upload-bar').classList.remove('show');
      toast(e.message || '保存失败，请检查网络后重试');
    }
    next();
  }

  /* ---------- 统计 ---------- */
  function openStats() {
    var imgs = 0;
    DB.notes.forEach(function(n) { imgs += (n.images ? n.images.length : 0); });
    $('st-notes').textContent = DB.notes.length;
    $('st-imgs').textContent = imgs;
    $('st-hobbies').textContent = DB.hobbies.length;
    var rows = $('stat-rows');
    rows.innerHTML = '';
    DB.hobbies.forEach(function(h) {
      var ns = DB.notes.filter(function(n) { return n.hobbyId === h.id; });
      var ic = 0;
      ns.forEach(function(n) { ic += (n.images ? n.images.length : 0); });
      var r = document.createElement('div');
      r.className = 'stat-row';
      r.innerHTML = '<span>' + h.icon + ' ' + h.name + '</span><span><b>' + ns.length + '</b> 条 · ' + ic + ' 图</span>';
      rows.appendChild(r);
    });
    $('mask-stats').classList.add('show');
  }

  /* ---------- 初始化 ---------- */
  function init() {
    loadData().then(function(d) {
      if (d) DB = d;
      if (!DB.password) {
        showPage('page-setup');
      } else if (sessionStorage.getItem('jiayi_ok') === '1') {
        enterMain();
      } else {
        showPage('page-login');
      }
    }).catch(function(e) {
      showPage('page-loading');
      document.querySelector('.loading-text').textContent = '加载失败：' + e.message + '（下拉刷新重试）';
    });
  }

  function enterMain() {
    if (!DB.hobbies || !DB.hobbies.length) DB.hobbies = DEFAULT_HOBBIES.slice();
    if (!DB.notes) DB.notes = [];
    curHobby = DB.hobbies[0].id;
    showPage('page-main');
    renderAll();
  }

  /* ---------- 事件绑定 ---------- */
  $('btn-setup').onclick = function() {
    var p1 = $('setup-pw').value, p2 = $('setup-pw2').value;
    if (p1.length < 4) { toast('密码至少 4 位哦'); return; }
    if (p1 !== p2) { toast('两次密码不一样，再检查一下'); return; }
    var btn = $('btn-setup');
    btn.disabled = true;
    hashPw(p1).then(function(h) {
      DB.password = h;
      DB.hobbies = DEFAULT_HOBBIES.slice();
      DB.notes = [];
      return saveData();
    }).then(function() {
      sessionStorage.setItem('jiayi_ok', '1');
      enterMain();
      toast('欢迎来到你的小天地 💙');
    }).catch(function(e) {
      btn.disabled = false;
      toast(e.message || '设置失败，请检查网络');
    });
  };

  $('btn-login').onclick = function() {
    var pw = $('login-pw').value;
    if (!pw) { toast('先输入密码哦'); return; }
    var btn = $('btn-login');
    btn.disabled = true;
    hashPw(pw).then(function(h) {
      if (h === DB.password) {
        sessionStorage.setItem('jiayi_ok', '1');
        enterMain();
      } else {
        toast('密码不对哦，再试试～');
      }
      btn.disabled = false;
    });
  };
  $('login-pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('btn-login').click(); });

  $('btn-add').onclick = function() {
    var h = DB.hobbies.filter(function(x) { return x.id === curHobby; })[0];
    $('note-hobby-name').textContent = h ? h.icon + ' ' + h.name : '';
    pendingImgs = [];
    renderPending();
    $('note-text').value = '';
    $('mask-note').classList.add('show');
  };
  $('btn-camera').onclick = function() { $('file-camera').click(); };
  $('btn-album').onclick = function() { $('file-album').click(); };
  $('file-camera').onchange = function() { handleFiles(this.files); this.value = ''; };
  $('file-album').onchange = function() { handleFiles(this.files); this.value = ''; };
  $('btn-save-note').onclick = saveNote;
  $('btn-cancel-note').onclick = function() { $('mask-note').classList.remove('show'); };

  $('btn-save-hobby').onclick = function() {
    var name = $('hobby-name').value.trim();
    if (!name) { toast('先给它起个名字吧'); return; }
    var h = { id: 'h' + Date.now(), name: name, icon: selEmoji };
    DB.hobbies.push(h);
    curHobby = h.id;
    $('mask-hobby').classList.remove('show');
    renderAll();
    saveData().then(function() { toast('新爱好创建成功 ✨'); }).catch(function(e) { toast(e.message); });
  };
  $('btn-cancel-hobby').onclick = function() { $('mask-hobby').classList.remove('show'); };

  $('btn-stats').onclick = openStats;
  $('btn-close-stats').onclick = function() { $('mask-stats').classList.remove('show'); };

  $('btn-settings').onclick = function() {
    $('pw-old').value = ''; $('pw-new').value = '';
    $('mask-settings').classList.add('show');
  };
  $('btn-close-settings').onclick = function() { $('mask-settings').classList.remove('show'); };
  $('btn-chpw').onclick = function() {
    var oldPw = $('pw-old').value, newPw = $('pw-new').value;
    if (!oldPw || !newPw) { toast('两个都要填哦'); return; }
    if (newPw.length < 4) { toast('新密码至少 4 位'); return; }
    hashPw(oldPw).then(function(h) {
      if (h !== DB.password) { toast('旧密码不对哦'); return null; }
      return hashPw(newPw).then(function(h2) {
        DB.password = h2;
        return saveData();
      }).then(function() {
        toast('密码改好啦 🔒');
        $('pw-old').value = ''; $('pw-new').value = '';
      });
    }).catch(function(e) { toast(e.message); });
  };
  $('btn-logout').onclick = function() {
    sessionStorage.removeItem('jiayi_ok');
    location.reload();
  };

  var masks = document.querySelectorAll('.mask');
  for (var i = 0; i < masks.length; i++) {
    (function(m) {
      m.addEventListener('click', function(e) { if (e.target === m) m.classList.remove('show'); });
    })(masks[i]);
  }

  init();
})();
</script>
</body>
</html>
